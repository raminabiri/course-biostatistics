<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc"><title id="title">Prism: choose Column, then enter temperatures</title><desc id="desc">Two schematic panels show the data-entry steps. Not a screenshot. Read the accompanying Persian guide for full steps.</desc><rect width="1000" height="560" fill="#f3f7fc"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="25" y="40" font-size="23" fill="#172b43" font-weight="700">Prism: choose Column, then enter temperatures</text><rect x="25" y="65" width="450" height="430" rx="12" fill="white" stroke="#b9c9da"/><path d="M 37 65 H 463 Q 475 65 475 77 V 113 H 25 V 77 Q 25 65 37 65" fill="#183b60"/><text x="43" y="96" font-size="18" fill="white" font-weight="700">1. New Table &amp; Graph</text><text x="45" y="145" font-size="24" fill="#172b43" font-weight="700">Column</text><text x="45" y="195" font-size="18" fill="#172b43" font-weight="400">Enter replicate values,</text><text x="45" y="225" font-size="18" fill="#172b43" font-weight="400">stacked into columns</text><text x="45" y="295" font-size="22" fill="#172b43" font-weight="700">Create</text><text x="45" y="365" font-size="16" fill="#172b43" font-weight="400">Here, each row is a different person.</text><text x="45" y="400" font-size="16" fill="#172b43" font-weight="400">No statistical test in this step.</text><rect x="525" y="65" width="450" height="430" rx="12" fill="white" stroke="#b9c9da"/><path d="M 537 65 H 963 Q 975 65 975 77 V 113 H 525 V 77 Q 525 65 537 65" fill="#183b60"/><text x="543" y="96" font-size="18" fill="white" font-weight="700">2. Column data table</text><rect x="545" y="135" width="130" height="38" fill="#e4eef8" stroke="#bdcbd9"/><text x="554" y="160" font-size="16" fill="#172b43" font-weight="700">Row titles</text><rect x="675" y="135" width="225" height="38" fill="#e4eef8" stroke="#bdcbd9"/><text x="684" y="160" font-size="16" fill="#172b43" font-weight="700">Temperature (C)</text><rect x="545" y="173" width="130" height="38" fill="#fff" stroke="#bdcbd9"/><text x="554" y="198" font-size="16" fill="#172b43" font-weight="400">P1</text><rect x="675" y="173" width="225" height="38" fill="#fff" stroke="#bdcbd9"/><text x="684" y="198" font-size="16" fill="#172b43" font-weight="400">36.8</text><rect x="545" y="211" width="130" height="38" fill="#fff" stroke="#bdcbd9"/><text x="554" y="236" font-size="16" fill="#172b43" font-weight="400">P2</text><rect x="675" y="211" width="225" height="38" fill="#fff" stroke="#bdcbd9"/><text x="684" y="236" font-size="16" fill="#172b43" font-weight="400">37.2</text><rect x="545" y="249" width="130" height="38" fill="#fff" stroke="#bdcbd9"/><text x="554" y="274" font-size="16" fill="#172b43" font-weight="400">P3</text><rect x="675" y="249" width="225" height="38" fill="#fff" stroke="#bdcbd9"/><text x="684" y="274" font-size="16" fill="#172b43" font-weight="400">38.1</text><text x="545" y="340" font-size="16" fill="#172b43" font-weight="400">Paste only Excel cells C2:C4.</text><text x="545" y="385" font-size="16" fill="#172b43" font-weight="400">Keep age in the original workbook.</text><text x="545" y="430" font-size="17" fill="#172b43" font-weight="400">File &gt; Save As</text><text x="25" y="535" font-size="16" fill="#50677f" font-weight="400">SCHEMATIC ONLY - menu positions vary by version.</text></g></svg>