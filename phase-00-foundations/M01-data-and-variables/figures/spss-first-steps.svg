<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc"><title id="title">SPSS: define columns, then enter people</title><desc id="desc">Two schematic panels show the data-entry steps. Not a screenshot. Read the accompanying Persian guide for full steps.</desc><rect width="1000" height="560" fill="#f3f7fc"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="25" y="40" font-size="23" fill="#172b43" font-weight="700">SPSS: define columns, then enter people</text><rect x="25" y="65" width="450" height="430" rx="12" fill="white" stroke="#b9c9da"/><path d="M 37 65 H 463 Q 475 65 475 77 V 113 H 25 V 77 Q 25 65 37 65" fill="#183b60"/><text x="43" y="96" font-size="18" fill="white" font-weight="700">1. Variable View</text><rect x="45" y="135" width="170" height="38" fill="#e4eef8" stroke="#bdcbd9"/><text x="54" y="160" font-size="16" fill="#172b43" font-weight="700">Name</text><rect x="215" y="135" width="105" height="38" fill="#e4eef8" stroke="#bdcbd9"/><text x="224" y="160" font-size="16" fill="#172b43" font-weight="700">Decimals</text><rect x="320" y="135" width="115" height="38" fill="#e4eef8" stroke="#bdcbd9"/><text x="329" y="160" font-size="16" fill="#172b43" font-weight="700">Measure</text><rect x="45" y="173" width="170" height="38" fill="#fff" stroke="#bdcbd9"/><text x="54" y="198" font-size="16" fill="#172b43" font-weight="400">patient_id</text><rect x="215" y="173" width="105" height="38" fill="#fff" stroke="#bdcbd9"/><text x="224" y="198" font-size="16" fill="#172b43" font-weight="400">0</text><rect x="320" y="173" width="115" height="38" fill="#fff" stroke="#bdcbd9"/><text x="329" y="198" font-size="16" fill="#172b43" font-weight="400">Nominal</text><rect x="45" y="211" width="170" height="38" fill="#fff" stroke="#bdcbd9"/><text x="54" y="236" font-size="16" fill="#172b43" font-weight="400">age</text><rect x="215" y="211" width="105" height="38" fill="#fff" stroke="#bdcbd9"/><text x="224" y="236" font-size="16" fill="#172b43" font-weight="400">0</text><rect x="320" y="211" width="115" height="38" fill="#fff" stroke="#bdcbd9"/><text x="329" y="236" font-size="16" fill="#172b43" font-weight="400">Scale</text><rect x="45" y="249" width="170" height="38" fill="#fff" stroke="#bdcbd9"/><text x="54" y="274" font-size="16" fill="#172b43" font-weight="400">temperature</text><rect x="215" y="249" width="105" height="38" fill="#fff" stroke="#bdcbd9"/><text x="224" y="274" font-size="16" fill="#172b43" font-weight="400">1</text><rect x="320" y="249" width="115" height="38" fill="#fff" stroke="#bdcbd9"/><text x="329" y="274" font-size="16" fill="#172b43" font-weight="400">Scale</text><text x="45" y="340" font-size="16" fill="#172b43" font-weight="400">Each row defines one data column.</text><text x="45" y="385" font-size="16" fill="#172b43" font-weight="400">Type = Numeric for these 3 columns.</text><rect x="525" y="65" width="450" height="430" rx="12" fill="white" stroke="#b9c9da"/><path d="M 537 65 H 963 Q 975 65 975 77 V 113 H 525 V 77 Q 525 65 537 65" fill="#183b60"/><text x="543" y="96" font-size="18" fill="white" font-weight="700">2. Data View</text><rect x="545" y="135" width="120" height="38" fill="#e4eef8" stroke="#bdcbd9"/><text x="554" y="160" font-size="16" fill="#172b43" font-weight="700">patient_id</text><rect x="665" y="135" width="70" height="38" fill="#e4eef8" stroke="#bdcbd9"/><text x="674" y="160" font-size="16" fill="#172b43" font-weight="700">age</text><rect x="735" y="135" width="165" height="38" fill="#e4eef8" stroke="#bdcbd9"/><text x="744" y="160" font-size="16" fill="#172b43" font-weight="700">temperature</text><rect x="545" y="173" width="120" height="38" fill="#fff" stroke="#bdcbd9"/><text x="554" y="198" font-size="16" fill="#172b43" font-weight="400">1</text><rect x="665" y="173" width="70" height="38" fill="#fff" stroke="#bdcbd9"/><text x="674" y="198" font-size="16" fill="#172b43" font-weight="400">24</text><rect x="735" y="173" width="165" height="38" fill="#fff" stroke="#bdcbd9"/><text x="744" y="198" font-size="16" fill="#172b43" font-weight="400">36.8</text><rect x="545" y="211" width="120" height="38" fill="#fff" stroke="#bdcbd9"/><text x="554" y="236" font-size="16" fill="#172b43" font-weight="400">2</text><rect x="665" y="211" width="70" height="38" fill="#fff" stroke="#bdcbd9"/><text x="674" y="236" font-size="16" fill="#172b43" font-weight="400">51</text><rect x="735" y="211" width="165" height="38" fill="#fff" stroke="#bdcbd9"/><text x="744" y="236" font-size="16" fill="#172b43" font-weight="400">37.2</text><rect x="545" y="249" width="120" height="38" fill="#fff" stroke="#bdcbd9"/><text x="554" y="274" font-size="16" fill="#172b43" font-weight="400">3</text><rect x="665" y="249" width="70" height="38" fill="#fff" stroke="#bdcbd9"/><text x="674" y="274" font-size="16" fill="#172b43" font-weight="400">38</text><rect x="735" y="249" width="165" height="38" fill="#fff" stroke="#bdcbd9"/><text x="744" y="274" font-size="16" fill="#172b43" font-weight="400">38.1</text><text x="545" y="340" font-size="16" fill="#172b43" font-weight="400">Each row now describes one person.</text><text x="545" y="385" font-size="16" fill="#172b43" font-weight="400">File &gt; Save As &gt; my_first_table.sav</text><text x="25" y="535" font-size="16" fill="#50677f" font-weight="400">SCHEMATIC ONLY - menu positions vary by version.</text></g></svg>